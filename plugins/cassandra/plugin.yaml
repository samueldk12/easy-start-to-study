id: cassandra
name: Apache Cassandra
category: data_engineering
description: Banco de dados distribuido NoSQL colunar de altissima escala e disponibilidade.
icon: database
badge: NoSQL / Wide-Column
default_port: 9042
ui_url: http://localhost:9042
env_vars: {}
default_folders: {}
dependencies: []
compose_services:
  cassandra:
    image: cassandra:5.0
    ports:
    - 9042:9042
    environment:
      CASSANDRA_CLUSTER_NAME: StudyCluster
volumes:
- cassandra_data
test_type: tcp
test_path: /
author: Community Plugin
version: 1.0.0

name: graph-nosql-study
services:
  neo4j:
    image: neo4j:5.20.0
    ports:
    - 7474:7474
    - 7687:7687
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password123}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
    - neo4j_data:/data
    networks:
    - graph-nosql-study-net
    container_name: graph-nosql-study-neo4j
  mongodb:
    image: mongo:7.0
    ports:
    - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password123}
    volumes:
    - mongodb_data:/data/db
    networks:
    - graph-nosql-study-net
    container_name: graph-nosql-study-mongodb
  mongo-express:
    image: mongo-express:latest
    ports:
    - 8091:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
    - mongodb
    networks:
    - graph-nosql-study-net
    container_name: graph-nosql-study-mongo-express
networks:
  graph-nosql-study-net:
    driver: bridge
volumes:
  neo4j_data: {}
  mongodb_data: {}

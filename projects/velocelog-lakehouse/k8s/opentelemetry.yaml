apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry
  namespace: stack-velocelog-lakehouse
  labels:
    app: opentelemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opentelemetry
  template:
    metadata:
      labels:
        app: opentelemetry
    spec:
      containers:
      - name: opentelemetry
        image: otel/opentelemetry-collector-contrib:0.102.0
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 13133
          name: health
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry
  namespace: stack-velocelog-lakehouse
  labels:
    app: opentelemetry
spec:
  type: ClusterIP
  ports:
  - port: 4317
    targetPort: 4317
    name: otlp-grpc
  - port: 4318
    targetPort: 4318
    name: otlp-http
  - port: 13133
    targetPort: 13133
    name: health
  selector:
    app: opentelemetry

name: velocelog-lakehouse
services:
  postgres:
    image: debezium/postgres:16-alpine
    container_name: velocelog-lakehouse-postgres
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    ports:
    - 5434:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oltp_db}
    volumes:
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d oltp_db
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - velocelog-lakehouse-net
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: velocelog-lakehouse-kafka
    ports:
    - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
    - velocelog-lakehouse-net
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: velocelog-lakehouse-schema-registry
    ports:
    - 8086:8081
    depends_on:
    - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
    - velocelog-lakehouse-net
  kafka-connect:
    image: debezium/connect:2.6.1.Final
    container_name: velocelog-lakehouse-kafka-connect
    ports:
    - 8083:8083
    depends_on:
    - kafka
    - postgres
    - schema-registry
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: '1'
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: '1'
      OFFSET_STORAGE_REPLICATION_FACTOR: '1'
      STATUS_STORAGE_REPLICATION_FACTOR: '1'
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
    networks:
    - velocelog-lakehouse-net
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: velocelog-lakehouse-kafka-ui
    ports:
    - 8087:8080
    depends_on:
    - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: velocelog-lakehouse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    networks:
    - velocelog-lakehouse-net
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: velocelog-lakehouse-minio
    command: server /data --console-address ":9001"
    ports:
    - 9000:9000
    - 9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - mc ready local || exit 0
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - velocelog-lakehouse-net
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: velocelog-lakehouse-minio-init
    depends_on:
    - minio
    entrypoint: /bin/sh -c "until (/usr/bin/mc alias set myminio http://minio:9000
      admin password123); do echo 'Waiting for MinIO...'; sleep 2; done; /usr/bin/mc
      mb --ignore-existing myminio/lakehouse; /usr/bin/mc mb --ignore-existing myminio/warehouse;
      echo 'Buckets created successfully!'; exit 0;"
    networks:
    - velocelog-lakehouse-net
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: velocelog-lakehouse-iceberg-rest
    ports:
    - 8181:8181
    depends_on:
    - minio
    - minio-init
    environment:
      CATALOG_WAREHOUSE: s3://lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      AWS_REGION: us-east-1
    networks:
    - velocelog-lakehouse-net
  spark-master:
    build:
      context: ./spark
    container_name: velocelog-lakehouse-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
    - 7077:7077
    - 8082:8080
    environment:
      SPARK_NO_DAEMONIZE: 'true'
    volumes:
    - ./spark/apps:/opt/spark/work-dir/apps
    networks:
    - velocelog-lakehouse-net
  spark-worker:
    build:
      context: ./spark
    container_name: velocelog-lakehouse-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: 'true'
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    volumes:
    - ./spark/apps:/opt/spark/work-dir/apps
    depends_on:
    - spark-master
    networks:
    - velocelog-lakehouse-net
  trino:
    image: trinodb/trino:450
    container_name: velocelog-lakehouse-trino
    ports:
    - 8085:8080
    volumes:
    - ./trino/etc:/etc/trino
    networks:
    - velocelog-lakehouse-net
    depends_on:
    - iceberg-rest
    - minio
  airflow-db:
    image: postgres:16-alpine
    container_name: velocelog-lakehouse-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
    - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U airflow -d airflow
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - velocelog-lakehouse-net
  airflow-init:
    image: apache/airflow:2.9.2-python3.11
    container_name: velocelog-lakehouse-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    command: bash -c "airflow db migrate && airflow users create --username admin
      --firstname Admin --lastname User --role Admin --email admin@example.com --password
      admin || true"
    networks:
    - velocelog-lakehouse-net
  airflow-webserver:
    image: apache/airflow:2.9.2-python3.11
    container_name: velocelog-lakehouse-airflow-webserver
    ports:
    - 8088:8080
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    command: airflow webserver
    networks:
    - velocelog-lakehouse-net
  airflow-scheduler:
    image: apache/airflow:2.9.2-python3.11
    container_name: velocelog-lakehouse-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    command: airflow scheduler
    networks:
    - velocelog-lakehouse-net
  redis:
    image: redis:7-alpine
    container_name: velocelog-lakehouse-redis
    ports:
    - 6380:6379
    volumes:
    - redis_data:/data
    networks:
    - velocelog-lakehouse-net
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: velocelog-lakehouse-redis-commander
    ports:
    - 8089:8081
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
    - redis
    networks:
    - velocelog-lakehouse-net
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: velocelog-lakehouse-rabbitmq
    ports:
    - 5673:5672
    - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    networks:
    - velocelog-lakehouse-net
  opentelemetry:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: velocelog-lakehouse-opentelemetry
    command:
    - --config=/etc/otelcol-contrib/config.yaml
    ports:
    - 4317:4317
    - 4318:4318
    - 13133:13133
    - 8888:8888
    volumes:
    - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
    - velocelog-lakehouse-net
networks:
  velocelog-lakehouse-net:
    driver: bridge
volumes:
  pg_data: {}
  minio_data: {}
  airflow_db_data: {}
  redis_data: {}
  rabbitmq_data: {}

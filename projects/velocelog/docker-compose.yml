name: velocelog
services:
  postgres:
    image: debezium/postgres:16-alpine
    container_name: velocelog-postgres
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    ports:
    - 5434:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oltp_db}
    volumes:
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || pg_isready
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - velocelog-net
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: velocelog-kafka
    ports:
    - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
    - velocelog-net
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: velocelog-schema-registry
    ports:
    - 8086:8081
    depends_on:
    - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
    - velocelog-net
  kafka-connect:
    image: debezium/connect:2.6.1.Final
    container_name: velocelog-kafka-connect
    ports:
    - 8083:8083
    depends_on:
    - kafka
    - postgres
    - schema-registry
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: '1'
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: '1'
      OFFSET_STORAGE_REPLICATION_FACTOR: '1'
      STATUS_STORAGE_REPLICATION_FACTOR: '1'
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
    networks:
    - velocelog-net
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: velocelog-kafka-ui
    ports:
    - 8087:8080
    depends_on:
    - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: velocelog
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    networks:
    - velocelog-net
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: velocelog-minio
    command: server /data --console-address ":9001"
    ports:
    - 9000:9000
    - 9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - mc ready local || exit 0
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - velocelog-net
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: velocelog-minio-init
    depends_on:
    - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    entrypoint: /bin/sh -c "until (/usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD); do echo 'Waiting for MinIO...'; sleep 2; done; /usr/bin/mc mb --ignore-existing myminio/lakehouse; /usr/bin/mc mb --ignore-existing myminio/warehouse; echo 'Buckets created successfully!'; exit 0;"
    networks:
    - velocelog-net
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: velocelog-iceberg-rest
    ports:
    - 8181:8181
    depends_on:
    - minio
    - minio-init
    environment:
      CATALOG_WAREHOUSE: s3://lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-admin123}
      AWS_REGION: us-east-1
    networks:
    - velocelog-net
  spark-master:
    build:
      context: ./spark
    container_name: velocelog-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
    - 7077:7077
    - 8082:8080
    environment:
      SPARK_NO_DAEMONIZE: 'true'
    volumes:
    - ./spark/apps:/opt/spark/work-dir/apps
    networks:
    - velocelog-net
  spark-worker:
    build:
      context: ./spark
    container_name: velocelog-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: 'true'
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    volumes:
    - ./spark/apps:/opt/spark/work-dir/apps
    depends_on:
    - spark-master
    networks:
    - velocelog-net
  trino:
    image: trinodb/trino:450
    container_name: velocelog-trino
    ports:
    - 8085:8080
    volumes:
    - ./trino/etc:/etc/trino
    networks:
    - velocelog-net
    depends_on:
    - iceberg-rest
    - minio
  airflow-db:
    image: postgres:16-alpine
    container_name: velocelog-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
    - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U airflow -d airflow
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - velocelog-net
  airflow-init:
    image: apache/airflow:2.9.2-python3.11
    container_name: velocelog-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW_USER: ${AIRFLOW_USER:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    command: bash -c "airflow db migrate && (airflow users create --username $$AIRFLOW_USER --firstname Admin --lastname User --role Admin --email admin@example.com --password $$AIRFLOW_PASSWORD || airflow users set-password --username $$AIRFLOW_USER --password $$AIRFLOW_PASSWORD || true)"
    networks:
    - velocelog-net
  airflow-webserver:
    image: apache/airflow:2.9.2-python3.11
    container_name: velocelog-airflow-webserver
    ports:
    - 8088:8080
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    command: airflow webserver
    networks:
    - velocelog-net
  airflow-scheduler:
    image: apache/airflow:2.9.2-python3.11
    container_name: velocelog-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    command: airflow scheduler
    networks:
    - velocelog-net
  vscode:
    image: codercom/code-server:latest
    container_name: velocelog-vscode
    entrypoint:
    - /bin/sh
    - /home/coder/project/vscode/entrypoint.sh
    environment:
      AUTO_INSTALL_EXTENSIONS: 'true'
    ports:
    - 8443:8080
    volumes:
    - ./:/home/coder/project
    networks:
    - velocelog-net
networks:
  velocelog-net:
    driver: bridge
volumes:
  pg_data: {}
  minio_data: {}
  airflow_db_data: {}

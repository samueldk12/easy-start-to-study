name: clean-lakehouse
services:
  postgres:
    image: debezium/postgres:16-alpine
    container_name: clean-lakehouse-postgres
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    ports:
    - 5434:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oltp_db}
    volumes:
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || pg_isready
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - clean-lakehouse-net
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: clean-lakehouse-kafka
    ports:
    - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
    - clean-lakehouse-net
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: clean-lakehouse-minio
    command: server /data --console-address ":9001"
    ports:
    - 9000:9000
    - 9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - mc ready local || exit 0
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - clean-lakehouse-net
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: clean-lakehouse-minio-init
    depends_on:
    - minio
    entrypoint: /bin/sh -c "until (/usr/bin/mc alias set myminio http://minio:9000
      admin ${MINIO_ROOT_PASSWORD:-password123}); do echo 'Waiting for MinIO...'; sleep 2; done; /usr/bin/mc
      mb --ignore-existing myminio/lakehouse; /usr/bin/mc mb --ignore-existing myminio/warehouse; /usr/bin/mc mb --ignore-existing myminio/mlflow;
      echo 'Buckets created successfully!'; exit 0;"
    networks:
    - clean-lakehouse-net
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: clean-lakehouse-iceberg-rest
    ports:
    - 8181:8181
    depends_on:
    - minio
    - minio-init
    environment:
      CATALOG_WAREHOUSE: s3://lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      AWS_REGION: us-east-1
    networks:
    - clean-lakehouse-net
  spark-master:
    build:
      context: ./spark
    container_name: clean-lakehouse-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
    - 7077:7077
    - 8082:8080
    environment:
      SPARK_NO_DAEMONIZE: 'true'
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    volumes:
    - ./spark/apps:/opt/spark/work-dir/apps
    networks:
    - clean-lakehouse-net
  spark-worker:
    build:
      context: ./spark
    container_name: clean-lakehouse-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: 'true'
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    volumes:
    - ./spark/apps:/opt/spark/work-dir/apps
    depends_on:
    - spark-master
    networks:
    - clean-lakehouse-net
  trino:
    image: trinodb/trino:450
    container_name: clean-lakehouse-trino
    ports:
    - 8085:8080
    volumes:
    - ./trino/etc:/etc/trino
    networks:
    - clean-lakehouse-net
    depends_on:
    - iceberg-rest
    - minio
  airflow-db:
    image: postgres:16-alpine
    container_name: clean-lakehouse-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
    - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U airflow -d airflow
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - clean-lakehouse-net
  airflow-init:
    build:
      context: ./airflow
    container_name: clean-lakehouse-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    command: bash -c "airflow db migrate && airflow users create --username admin
      --firstname Admin --lastname User --role Admin --email admin@example.com --password
      admin || true"
    networks:
    - clean-lakehouse-net
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: clean-lakehouse-mlflow
    ports:
    - 5000:5000
    depends_on:
    - minio
    - minio-init
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root s3://mlflow/
    networks:
    - clean-lakehouse-net
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  airflow-webserver:
    build:
      context: ./airflow
    container_name: clean-lakehouse-airflow-webserver
    ports:
    - 8088:8080
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - /var/run/docker.sock:/var/run/docker.sock
    command: airflow webserver
    networks:
    - clean-lakehouse-net
  airflow-scheduler:
    build:
      context: ./airflow
    container_name: clean-lakehouse-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - /var/run/docker.sock:/var/run/docker.sock
    command: airflow scheduler
    networks:
    - clean-lakehouse-net
networks:
  clean-lakehouse-net:
    driver: bridge
volumes:
  pg_data: {}
  minio_data: {}
  airflow_db_data: {}

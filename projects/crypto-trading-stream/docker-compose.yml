name: crypto-trading-stream
services:
  postgres:
    image: debezium/postgres:16-alpine
    container_name: crypto-trading-stream-postgres
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    ports:
    - 5434:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oltp_db}
    volumes:
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || pg_isready
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - crypto-trading-stream-net
  redis:
    image: redis:7-alpine
    container_name: crypto-trading-stream-redis
    ports:
    - 6380:6379
    volumes:
    - redis_data:/data
    networks:
    - crypto-trading-stream-net
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: crypto-trading-stream-redis-commander
    ports:
    - 8089:8081
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
    - redis
    networks:
    - crypto-trading-stream-net
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: crypto-trading-stream-rabbitmq
    ports:
    - 5673:5672
    - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    networks:
    - crypto-trading-stream-net
networks:
  crypto-trading-stream-net:
    driver: bridge
volumes:
  pg_data: {}
  redis_data: {}
  rabbitmq_data: {}

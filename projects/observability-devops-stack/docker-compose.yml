name: observability-devops-stack
services:
  postgres:
    image: debezium/postgres:16-alpine
    container_name: observability-devops-stack-postgres
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    ports:
    - 5438:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oltp_db}
    volumes:
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d oltp_db
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - observability-devops-stack-net
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: observability-devops-stack-clickhouse
    ports:
    - 8124:8123
    - 9000:9000
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
    - clickhouse_data:/var/lib/clickhouse
    networks:
    - observability-devops-stack-net
  grafana:
    image: grafana/grafana:11.0.0
    container_name: observability-devops-stack-grafana
    ports:
    - 3005:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
    - grafana_data:/var/lib/grafana
    networks:
    - observability-devops-stack-net
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: observability-devops-stack-prometheus
    ports:
    - 9095:9090
    volumes:
    - prometheus_data:/prometheus
    networks:
    - observability-devops-stack-net
  portainer:
    image: portainer/portainer-ce:latest
    container_name: observability-devops-stack-portainer
    ports:
    - 9005:9000
    - 9444:9443
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer_data:/data
    networks:
    - observability-devops-stack-net
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: observability-devops-stack-pgadmin
    ports:
    - 5055:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@lakehouse.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
    - pgadmin_data:/var/lib/pgadmin
    networks:
    - observability-devops-stack-net
networks:
  observability-devops-stack-net:
    driver: bridge
volumes:
  pg_data: {}
  clickhouse_data: {}
  grafana_data: {}
  prometheus_data: {}
  portainer_data: {}
  pgadmin_data: {}

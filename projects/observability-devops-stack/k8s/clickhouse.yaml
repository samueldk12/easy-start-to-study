apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: stack-observability-devops-stack
  labels:
    app: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:24.3
        ports:
        - containerPort: 8123
          name: http
        - containerPort: 9000
          name: native
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: stack-observability-devops-stack
  labels:
    app: clickhouse
spec:
  type: ClusterIP
  ports:
  - port: 8123
    targetPort: 8123
    name: http
  selector:
    app: clickhouse

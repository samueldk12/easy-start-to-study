name: veloceg-teste
services:
  postgres:
    image: debezium/postgres:16-alpine
    container_name: veloceg-teste-postgres
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    ports:
    - 5434:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-veloceg_teste}
    volumes:
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || pg_isready
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - veloceg-teste-net
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: veloceg-teste-clickhouse
    ports:
    - 8123:8123
    - 9009:9000
    volumes:
    - clickhouse_data:/var/lib/clickhouse
    - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
    - veloceg-teste-net
  doris-fe:
    image: apache/doris:2.0.3-fe-x86_64
    container_name: veloceg-teste-doris-fe
    ports:
    - 8030:8030
    - 9030:9030
    environment:
      FE_SERVERS: fe1:127.0.0.1:9010
      FE_ID: '1'
    volumes:
    - doris_fe_meta:/opt/apache-doris/fe/doris-meta
    networks:
    - veloceg-teste-net
  doris-be:
    image: apache/doris:2.0.3-be-x86_64
    container_name: veloceg-teste-doris-be
    depends_on:
    - doris-fe
    ports:
    - 8040:8040
    - 9050:9050
    environment:
      FE_SERVERS: fe1:doris-fe:9010
      BE_ADDR: doris-be:9050
    volumes:
    - doris_be_storage:/opt/apache-doris/be/storage
    networks:
    - veloceg-teste-net
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: veloceg-teste-kafka
    ports:
    - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
    - veloceg-teste-net
  redpanda:
    image: redpandadata/redpanda:v24.1.2
    container_name: veloceg-teste-redpanda
    command:
    - redpanda
    - start
    - --overprovisioned
    - --smp
    - '1'
    - --memory
    - 1G
    - --reserve-memory
    - 0M
    - --node-id
    - '0'
    - --check=false
    ports:
    - 19092:9092
    - 18081:8081
    - 18082:8082
    volumes:
    - redpanda_data:/var/lib/redpanda/data
    networks:
    - veloceg-teste-net
  redpanda-console:
    image: redpandadata/console:v2.5.2
    container_name: veloceg-teste-redpanda-console
    depends_on:
    - redpanda
    ports:
    - 8099:8080
    environment:
      KAFKA_BROKERS: redpanda:9092
    networks:
    - veloceg-teste-net
  kafka-connect:
    image: debezium/connect:2.6.1.Final
    container_name: veloceg-teste-kafka-connect
    ports:
    - 8083:8083
    depends_on:
    - kafka
    - postgres
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: '1'
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: '1'
      OFFSET_STORAGE_REPLICATION_FACTOR: '1'
      STATUS_STORAGE_REPLICATION_FACTOR: '1'
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
    networks:
    - veloceg-teste-net
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: veloceg-teste-kafka-ui
    ports:
    - 8087:8080
    depends_on:
    - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: veloceg-teste
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    networks:
    - veloceg-teste-net
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: veloceg-teste-minio
    command: server /data --console-address ":9001"
    ports:
    - 9000:9000
    - 9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - mc ready local || exit 0
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - veloceg-teste-net
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: veloceg-teste-minio-init
    depends_on:
    - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    entrypoint: /bin/sh -c "until (/usr/bin/mc alias set myminio http://minio:9000
      $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD); do echo 'Waiting for MinIO...'; sleep
      2; done; /usr/bin/mc mb --ignore-existing myminio/lakehouse; /usr/bin/mc mb
      --ignore-existing myminio/warehouse; echo 'Buckets created successfully!'; exit
      0;"
    networks:
    - veloceg-teste-net
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: veloceg-teste-iceberg-rest
    ports:
    - 8181:8181
    depends_on:
    - minio
    - minio-init
    environment:
      CATALOG_WAREHOUSE: s3://lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-admin123}
      AWS_REGION: us-east-1
    networks:
    - veloceg-teste-net
  spark-master:
    build:
      context: ./spark
    container_name: veloceg-teste-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
    - 7077:7077
    - 8082:8080
    environment:
      SPARK_NO_DAEMONIZE: 'true'
    volumes:
    - ./spark/apps:/opt/spark/work-dir/apps
    networks:
    - veloceg-teste-net
  spark-worker:
    build:
      context: ./spark
    container_name: veloceg-teste-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: 'true'
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    volumes:
    - ./spark/apps:/opt/spark/work-dir/apps
    depends_on:
    - spark-master
    networks:
    - veloceg-teste-net
  flink-jobmanager:
    image: flink:1.19-scala_2.12-java11
    container_name: veloceg-teste-flink-jobmanager
    command: jobmanager
    ports:
    - 8093:8081
    environment:
      FLINK_PROPERTIES: 'jobmanager.rpc.address: flink-jobmanager'
    volumes:
    - ./flink/jobs:/opt/flink/usrlib
    - flink_data:/opt/flink/data
    networks:
    - veloceg-teste-net
  flink-taskmanager:
    image: flink:1.19-scala_2.12-java11
    container_name: veloceg-teste-flink-taskmanager
    depends_on:
    - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: 'jobmanager.rpc.address: flink-jobmanager\ntaskmanager.numberOfTaskSlots:
        2'
    volumes:
    - ./flink/jobs:/opt/flink/usrlib
    networks:
    - veloceg-teste-net
  superset:
    image: apache/superset:4.0.1
    container_name: veloceg-teste-superset
    ports:
    - 8094:8088
    environment:
      SUPERSET_SECRET_KEY: supersecretkey123456789
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin123}
    volumes:
    - superset_home:/app/superset_home
    networks:
    - veloceg-teste-net
  airflow-db:
    image: postgres:16-alpine
    container_name: veloceg-teste-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
    - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U airflow -d airflow
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - veloceg-teste-net
  airflow-init:
    image: apache/airflow:2.9.2-python3.11
    container_name: veloceg-teste-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW_USER: ${AIRFLOW_USER:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin123}
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin123}
    command: bash -c "airflow db migrate && (airflow users create --username $$AIRFLOW_USER
      --firstname Admin --lastname User --role Admin --email admin@example.com --password
      $$AIRFLOW_PASSWORD || airflow users reset-password --username $$AIRFLOW_USER
      --password $$AIRFLOW_PASSWORD || true)"
    networks:
    - veloceg-teste-net
  airflow-webserver:
    image: apache/airflow:2.9.2-python3.11
    container_name: veloceg-teste-airflow-webserver
    ports:
    - 8088:8080
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW_USER: ${AIRFLOW_USER:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin123}
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin123}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    command: airflow webserver
    networks:
    - veloceg-teste-net
  airflow-scheduler:
    image: apache/airflow:2.9.2-python3.11
    container_name: veloceg-teste-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW_USER: ${AIRFLOW_USER:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin123}
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin123}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    command: airflow scheduler
    networks:
    - veloceg-teste-net
networks:
  veloceg-teste-net:
    driver: bridge
volumes:
  pg_data: {}
  clickhouse_data: {}
  doris_fe_meta: {}
  doris_be_storage: {}
  redpanda_data: {}
  minio_data: {}
  flink_data: {}
  superset_home: {}
  airflow_db_data: {}
